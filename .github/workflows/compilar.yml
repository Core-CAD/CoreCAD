name: Package Modular Core CAD

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  package-windows:
    runs-on: windows-latest

    steps:
    - name: 1. Checkout repository
      uses: actions/checkout@v4

    - name: 2. Download latest stable CAD engine
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Downloading official stable release package..."
        gh release download --repo FreeCAD/FreeCAD --pattern "*Win*.7z"
        7z x *.7z -obuild/CoreCAD > /dev/null

    - name: 3. Clean up native branding and start page
      shell: bash
      run: |
        echo "Renaming main executables..."
        mv build/CoreCAD/bin/FreeCAD.exe build/CoreCAD/bin/CoreCAD.exe 2>/dev/null || true
        mv build/CoreCAD/bin/FreeCADCmd.exe build/CoreCAD/bin/CoreCADCmd.exe 2>/dev/null || true

        echo "Removing default Start workbench (prevents original splash and news screen)..."
        rm -rf build/CoreCAD/Mod/Start

    - name: 4. Inject isolated CoreCAD module
      shell: bash
      run: |
        echo "Injecting isolated module folder..."
        mkdir -p build/CoreCAD/Mod/CoreCAD
        if [ -d "Mod/CoreCAD" ]; then
          cp -r Mod/CoreCAD/* build/CoreCAD/Mod/CoreCAD/
        fi

    - name: 5. Upload clean application artifact
      uses: actions/upload-artifact@v4
      with:
        name: CoreCAD-Windows-Modular
        path: build/CoreCAD