name: Compilar Core CAD Nativo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: 1. Baixar Código Fonte
      uses: actions/checkout@v4

    - name: 2. Baixar Última Versão do Motor CAD
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Baixando o motor 3D oficial..."
        gh release download --repo FreeCAD/FreeCAD --pattern "*Win*.7z"
        7z x *.7z -obuild/CoreCAD > /dev/null

    - name: 3. Aplicar Branding e Renomear Binários
      shell: bash
      run: |
        echo "Renomeando o executável principal..."
        mv build/CoreCAD/bin/FreeCAD.exe build/CoreCAD/bin/CoreCAD.exe 2>/dev/null || true
        mv build/CoreCAD/bin/FreeCADCmd.exe build/CoreCAD/bin/CoreCADCmd.exe 2>/dev/null || true

        echo "Removendo a tela inicial nativa (Start module)..."
        rm -rf build/CoreCAD/Mod/Start

        echo "Gerando imagens pretas para substituição de logos..."
        echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVQI12P4//8/AAX+Av7czFnnAAAAAElFTkSuQmCC" | base64 -d > black.png
        
        # Substitui ícones e splash screens mantendo a estrutura limpa
        cp black.png build/CoreCAD/data/Gui/Images/splash_background.png 2>/dev/null || true
        cp black.png build/CoreCAD/data/Gui/Images/freecad-splash.png 2>/dev/null || true
        cp black.png build/CoreCAD/data/Gui/Images/freecad.png 2>/dev/null || true

    - name: 4. Injetar Módulo Core CAD (Estrutura Isolada)
      shell: bash
      run: |
        echo "Copiando o módulo CoreCAD de forma isolada..."
        mkdir -p build/CoreCAD/Mod/CoreCAD
        if [ -d "Mod/CoreCAD" ]; then
          cp -r Mod/CoreCAD/* build/CoreCAD/Mod/CoreCAD/
        fi

    - name: 5. Empacotar Distribuição
      uses: actions/upload-artifact@v4
      with:
        name: CoreCAD-Windows-Nativo-v1.0
        path: build/CoreCAD