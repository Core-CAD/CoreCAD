name: Compilar Core CAD Nativo (C++)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-cpp-windows:
    runs-on: windows-latest

    steps:
    - name: 1. Baixar o Repositório do Projeto
      uses: actions/checkout@v4

    - name: 2. Baixar Código-Fonte C++ Oficial
      shell: bash
      run: |
        echo "Clonando o repositório de código-fonte..."
        git clone --depth 1 https://github.com/FreeCAD/FreeCAD.git src-freecad

    - name: 3. Injetar Branding Nativo no Código-Fonte (Core CAD)
      shell: bash
      run: |
        echo "Substituindo ocorrências de texto no código-fonte..."
        find src-freecad/src/ -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.ui" \) -exec sed -i 's/FreeCAD/Core CAD/g' {} +

        echo "Gerando imagem de substituição..."
        echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVQI12P4//8/AAX+Av7czFnnAAAAAElFTkSuQmCC" | base64 -d > black.png

        echo "Substituindo recursos visuais originais..."
        cp black.png src-freecad/src/Gui/Resources/icons/freecad.png 2>/dev/null || true
        cp black.png src-freecad/src/Gui/Resources/icons/freecad.svg 2>/dev/null || true
        cp black.png src-freecad/src/Gui/Resources/images/splash_background.png 2>/dev/null || true

    - name: 4. Configurar Ambiente Pixi / CMake
      uses: prefix-dev/setup-pixi@v0
      with:
        project-path: src-freecad

    - name: 5. Compilar Código-Fonte em C++
      shell: bash
      run: |
        cd src-freecad
        echo "Configurando o build com CMake..."
        pixi run configure
        echo "Iniciando compilação MSVC..."
        pixi run build

    - name: 6. Injetar Módulos Customizados
      shell: bash
      run: |
        echo "Copiando módulos do repositório para o build final..."
        mkdir -p src-freecad/build/bin/Mod/CoreCAD
        if [ -d "Mod/CoreCAD" ]; then
          cp -r Mod/CoreCAD/* src-freecad/build/bin/Mod/CoreCAD/
        fi

    - name: 7. Empacotar Artefato Nativo (.exe + DLLs)
      uses: actions/upload-artifact@v4
      with:
        name: CoreCAD-Windows-Native-Build
        path: src-freecad/build/bin