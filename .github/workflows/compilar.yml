name: Compile Native Core CAD (C++)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-cpp-windows:
    runs-on: windows-latest

    steps:
    - name: 1. Checkout repository code
      uses: actions/checkout@v4

    - name: 2. Setup MSVC C++ compiler environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: 3. Clone official C++ source code
      shell: bash
      run: |
        echo "Cloning source code repository..."
        git clone --depth 1 https://github.com/FreeCAD/FreeCAD.git src-freecad

    - name: 4. Setup Pixi environment
      uses: prefix-dev/setup-pixi@v0
      with:
        manifest-path: src-freecad/pixi.toml

    - name: 5. Configure CMake build environment
      working-directory: src-freecad
      shell: bash
      run: |
        echo "Configuring build directory with CMake..."
        pixi run configure

    - name: 6. Compile C++ source code
      working-directory: src-freecad
      shell: bash
      env:
        CMAKE_BUILD_PARALLEL_LEVEL: '2'
      run: |
        echo "Starting C++ compilation with Ninja and MSVC..."
        pixi run build

    - name: 7. Inject custom modules and rename output binary
      shell: bash
      run: |
        echo "Renaming compiled executable..."
        mv src-freecad/build/bin/FreeCAD.exe src-freecad/build/bin/CoreCAD.exe 2>/dev/null || true
        
        echo "Copying repository modules to output directory..."
        mkdir -p src-freecad/build/bin/Mod/CoreCAD
        if [ -d "Mod/CoreCAD" ]; then
          cp -r Mod/CoreCAD/* src-freecad/build/bin/Mod/CoreCAD/
        fi

    - name: 8. Upload native build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CoreCAD-Windows-Native-Build
        path: src-freecad/build/bin