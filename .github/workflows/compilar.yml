name: Package Modular Core CAD

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  package-windows:
    runs-on: windows-latest

    steps:
    - name: 1. Checkout repository
      uses: actions/checkout@v4

    - name: 2. Download stable CAD engine into isolated app folder
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Downloading official release..."
        gh release download --repo FreeCAD/FreeCAD --pattern "*Win*.7z"
        mkdir -p build/CoreCAD/app
        7z x *.7z -obuild/CoreCAD/app > /dev/null

    - name: 3. Remove start workbench
      shell: bash
      run: |
        echo "Removing native start workbench..."
        rm -rf build/CoreCAD/app/Mod/Start

    - name: 4. Inject custom CoreCAD module
      shell: bash
      run: |
        echo "Injecting isolated module directory..."
        mkdir -p build/CoreCAD/app/Mod/CoreCAD
        if [ -d "Mod/CoreCAD" ]; then
          cp -r Mod/CoreCAD/* build/CoreCAD/app/Mod/CoreCAD/
        fi

    - name: 5. Compile C++ native GUI launcher
      shell: bash
      run: |
        echo "Compiling silent CoreCAD launcher..."
        cat << 'EOF' > launcher.cpp
        #include <windows.h>
        int WINAPI WinMain(HINSTANCE hInstance, HINSTANCE hPrevInstance, LPSTR lpCmdLine, int nCmdShow) {
            char baseDir[MAX_PATH];
            GetModuleFileNameA(NULL, baseDir, MAX_PATH);
            char* lastSlash = strrchr(baseDir, '\\');
            if (lastSlash) *lastSlash = '\0';

            char exePath[MAX_PATH];
            wsprintfA(exePath, "%s\\app\\bin\\FreeCAD.exe", baseDir);

            char appDir[MAX_PATH];
            wsprintfA(appDir, "%s\\app", baseDir);

            STARTUPINFOA si = { sizeof(si) };
            PROCESS_INFORMATION pi;
            CreateProcessA(exePath, "app\\bin\\FreeCAD.exe --nosplash", NULL, NULL, FALSE, 0, NULL, appDir, &si, &pi);
            return 0;
        }
        EOF
        g++ -O2 launcher.cpp -o build/CoreCAD/CoreCAD.exe -mwindows

    - name: 6. Upload clean application artifact
      uses: actions/upload-artifact@v4
      with:
        name: CoreCAD-Windows-Clean
        path: build/CoreCAD