name: Package Modular Core CAD

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  package-windows:
    runs-on: windows-latest

    steps:
    - name: 1. Checkout repository
      uses: actions/checkout@v4

    - name: 2. Download latest stable CAD engine
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Downloading official stable release package..."
        gh release download --repo FreeCAD/FreeCAD --pattern "*Win*.7z"
        7z x *.7z -obuild/CoreCAD > /dev/null

    - name: 3. Overwrite visual resources with black image
      shell: bash
      run: |
        echo "Generating 1x1 black image asset..."
        echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVQI12P4//8/AAX+Av7czFnnAAAAAElFTkSuQmCC" | base64 -d > black.png

        echo "Overwriting splash screens, logos, and icons..."
        find build/CoreCAD/data/ -type f \( -name "*.png" -o -name "*.svg" \) -exec cp black.png {} + 2>/dev/null || true
        find build/CoreCAD/bin/ -type f \( -name "*.png" -o -name "*.svg" \) -exec cp black.png {} + 2>/dev/null || true

    - name: 4. Rename executable and remove start module
      shell: bash
      run: |
        echo "Renaming executables..."
        mv build/CoreCAD/bin/FreeCAD.exe build/CoreCAD/bin/CoreCAD.exe 2>/dev/null || true
        mv build/CoreCAD/bin/FreeCADCmd.exe build/CoreCAD/bin/CoreCADCmd.exe 2>/dev/null || true

        echo "Removing default start workbench..."
        rm -rf build/CoreCAD/Mod/Start

    - name: 5. Inject isolated CoreCAD module
      shell: bash
      run: |
        echo "Injecting custom module..."
        mkdir -p build/CoreCAD/Mod/CoreCAD
        if [ -d "Mod/CoreCAD" ]; then
          cp -r Mod/CoreCAD/* build/CoreCAD/Mod/CoreCAD/
        fi

    - name: 6. Set hidden attribute for Mod directory
      shell: powershell
      run: |
        Write-Host "Hiding Mod directory in Windows build..."
        if (Test-Path "build\CoreCAD\Mod") {
            Set-ItemProperty -Path "build\CoreCAD\Mod" -Name Attributes -Value "Hidden"
        }

    - name: 7. Upload branded application artifact
      uses: actions/upload-artifact@v4
      with:
        name: CoreCAD-Windows-Modular
        path: build/CoreCAD