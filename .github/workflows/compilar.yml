name: Compilar Core CAD Nativo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: 1. Baixar o Código do Repositório
      uses: actions/checkout@v4

    - name: 2. Configurar Python e Ferramentas de Build
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Preparar Estrutura do Core CAD
      shell: bash
      run: |
        echo "Organizando arquivos de módulo e configurações..."
        mkdir -p build/CoreCAD/Mod
        mkdir -p build/CoreCAD/config
        
        # Copia os módulos se existirem, sem travar o build se estiver vazio
        if [ -d "Mod/CoreCAD" ]; then
          cp -r Mod/CoreCAD build/CoreCAD/Mod/
        fi

        if [ -d "config" ]; then
          cp -r config/* build/CoreCAD/config/ 2>/dev/null || true
        fi

        if [ -f "Customizar_UI.bat" ]; then
          cp Customizar_UI.bat build/CoreCAD/
        fi

    - name: 4. Empacotar Artefatos da Aplicação
      uses: actions/upload-artifact@v4
      with:
        name: CoreCAD-Windows-Portable
        path: build/CoreCAD